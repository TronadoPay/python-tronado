[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tronado"
# Keep in sync with SDK_VERSION in src/tronado/constants.py.
version = "0.1.1"
description = "Production-grade, version-aware Python SDK for the Tronado Public API (v5)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tronado SDK contributors" }]
keywords = ["tronado", "tron", "trx", "payments", "crypto", "sdk", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "tox>=4.0",
]

[project.urls]
Homepage = "https://t.me/TronadoBusiness"
Documentation = "https://documenter.getpostman.com/view/48018954/2sBXwwm7St"
Support = "https://t.me/TronadoSupp"

[tool.hatch.build.targets.wheel]
packages = ["src/tronado"]

[tool.hatch.build.targets.sdist]
include = ["src/tronado", "README.md", "LICENSE", "CHANGELOG.md", "docs", "examples", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "A", "C4", "SIM"]
# We keep capitalized `typing` generics (Dict/Tuple/Type/Optional/Union) uniformly:
# Optional/Union must stay (PEP 604 `X | Y` breaks at runtime on 3.9 with Pydantic),
# so for internal consistency we keep the rest in `typing` too rather than mixing styles.
ignore = ["UP006", "UP035"]

[tool.ruff.lint.pyupgrade]
# Pydantic and dataclasses evaluate annotations at runtime; on Python 3.9 the PEP 604
# `X | Y` form would break there, so keep `Optional`/`Union`/`Dict`/`Tuple`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# `id` / `hash` mirror the documented API field/parameter names.
"src/tronado/models/order.py" = ["A003"]
"src/tronado/models/webhook.py" = ["A003"]
"src/tronado/versions/v5/resources.py" = ["A002"]

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
