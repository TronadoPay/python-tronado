name: Release

# Push a version tag (e.g. v0.2.0) to publish that version to PyPI and create the
# matching GitHub release. Publishing uses PyPI trusted publishing (OIDC), so no API
# token is stored anywhere; the PyPI project trusts this workflow and the `pypi`
# environment instead.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          with open("src/tronado/constants.py", encoding="utf-8") as f:
              sdk = re.search(r'^SDK_VERSION = "([^"]+)"', f.read(), re.M).group(1)
          if not tag == project == sdk:
              sys.exit(f"Version mismatch: tag={tag} pyproject={project} SDK_VERSION={sdk}")
          print(f"Releasing {tag}")
          EOF
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine
      - name: Lint, type-check and test
        run: |
          ruff check .
          mypy src
          pytest -q
      - name: Build and check distributions
        run: |
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tronado
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
